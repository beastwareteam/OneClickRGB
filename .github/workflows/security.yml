name: 🔒 Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
  schedule:
    - cron: '0 2 * * 1'  # Weekly, Monday 02:00

jobs:
  codeql:
    name: CodeQL Analysis
    # The application only builds on Windows, so CodeQL has to run there too.
    runs-on: windows-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended

      - name: Build
        run: |
          cmake -S . -B build -A x64 -DONECLICKRGB_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Limited to the portable modules: the Win32 front end drags in headers
      # cppcheck cannot resolve on Linux, which would bury real findings in
      # noise. These are the files with the protocol logic anyway.
      - name: Run cppcheck
        run: >
          cppcheck --error-exitcode=1 --enable=warning,performance,portability
          --inline-suppr --std=c++17 --quiet
          -I src
          src/devices src/hal/smbus_backend.cpp src/profile.cpp
