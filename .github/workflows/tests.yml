name: 🧪 Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary target. Includes the autostart tests, which are Windows-only
  # because the scheduled-task definition is.
  windows:
    name: Unit Tests (Windows / MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DONECLICKRGB_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

  # The device protocols and profile storage carry no Windows dependency, so
  # they also build under GCC. This is what gets us the sanitizers - MSVC has no
  # equivalent for UBSan, and protocol code is exactly where an out-of-bounds
  # packet write would hide.
  linux-sanitizers:
    name: Unit Tests (Linux / ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DONECLICKRGB_BUILD_APP=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
