name: 🔨 Build

# OneClickRGB is a Win32 application: it links user32, gdiplus, uxtheme and the
# PawnIO kernel-driver interface. The previous Linux and macOS matrix entries
# could never have produced a binary, so this workflow builds what actually
# exists. Portable-core compilation under GCC is covered by tests.yml.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'dependencies/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'dependencies/**'
      - 'CMakeLists.txt'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows MSVC (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DONECLICKRGB_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OneClickRGB.exe dist/
          Copy-Item dependencies/hidapi/hidapi.dll dist/
          Copy-Item dependencies/PawnIO/PawnIOLib.dll dist/
          Copy-Item dependencies/PawnIO/modules/SmbusI801.bin dist/
          Copy-Item portable/install.bat, portable/uninstall.bat, portable/README.txt dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneClickRGB-windows-${{ github.run_number }}
          path: dist/
          retention-days: 14
