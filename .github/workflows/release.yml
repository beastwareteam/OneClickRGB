name: 📦 Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # A tagged build that has not passed its tests should not be published.
      - name: Run tests
        run: |
          cmake -S . -B build_tests -DONECLICKRGB_BUILD_APP=OFF
          cmake --build build_tests --config Debug --parallel
          ctest --test-dir build_tests -C Debug --output-on-failure

      - name: Build application
        run: |
          cmake -S . -B build -A x64 -DONECLICKRGB_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      - name: Assemble portable package
        shell: pwsh
        run: |
          $stage = "OneClickRGB"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/OneClickRGB.exe $stage/
          Copy-Item dependencies/hidapi/hidapi.dll $stage/
          Copy-Item dependencies/PawnIO/PawnIOLib.dll $stage/
          Copy-Item dependencies/PawnIO/modules/SmbusI801.bin $stage/
          Copy-Item src/icon.png $stage/
          Copy-Item portable/install.bat, portable/install_manual.bat, `
                    portable/uninstall.bat, portable/README.txt $stage/
          Compress-Archive -Path $stage -DestinationPath `
            "OneClickRGB_${{ steps.version.outputs.version }}_Portable.zip"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Section for this version, up to the next "## " heading.
            awk -v v="$VERSION" '
              $0 ~ "^## \\[?" v "\\]?" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $VERSION" > RELEASE_NOTES.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') }}
          files: OneClickRGB_${{ steps.version.outputs.version }}_Portable.zip
